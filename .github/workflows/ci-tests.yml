name: CI Tests

on:
  push:
    branches:
      - master
      - security
  pull_request:
    branches:
      - master
      - security
  workflow_dispatch:

concurrency:
  group: ci-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet-tests:
    name: .NET Build and Security Tests
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build native MIDI shim (Windows x64)
        shell: pwsh
        working-directory: native
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

          New-Item -Force -ItemType Directory "windows-x64" | Out-Null

          $dllPath = "build\Release\netkeyer_midi_shim.dll"
          if (-not (Test-Path $dllPath)) {
            throw "Expected native shim at '$dllPath' was not found."
          }

          Copy-Item $dllPath "windows-x64\"

      - name: Restore app
        run: dotnet restore NetKeyer.csproj

      - name: Build app (Debug)
        run: dotnet build NetKeyer.csproj -c Debug --no-restore

      - name: Run targeted security tests
        run: dotnet test tests/NetKeyer.Tests/NetKeyer.Tests.csproj -c Debug --no-build --verbosity normal
