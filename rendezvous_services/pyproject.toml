[project]
name = "netkeyer-rendezvous-services"
version = "0.1.0"
description = "Rendezvous and relay services for NetKeyer"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.7,<3.0",
    "uvicorn>=0.30,<1.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx2>=2.5.0",
]
