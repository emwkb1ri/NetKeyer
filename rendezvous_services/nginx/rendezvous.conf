upstream rendezvous_backend {
    server rendezvous:49920;
}

limit_req_zone $binary_remote_addr zone=api_rate:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=ws_rate:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

map $limit_req_status $limit_req_status_safe {
    "" PASSED;
    default $limit_req_status;
}

log_format security_main
    'time="$time_iso8601" remote="$remote_addr" host="$host" '
    'method="$request_method" uri="$request_uri" status=$status '
    'bytes_sent=$bytes_sent req_time=$request_time upstream="$upstream_addr" '
    'upstream_status="$upstream_status" upstream_time="$upstream_response_time" '
    'limit_req="$limit_req_status_safe" conn="$connection" conn_reqs=$connection_requests '
    'xff="$http_x_forwarded_for" ua="$http_user_agent"';

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    access_log /dev/stdout security_main;
    limit_req_status 429;
    limit_conn_status 429;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 10s;

    location /health {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        limit_req zone=api_rate burst=10 nodelay;
        limit_conn conn_limit 10;

        proxy_pass http://rendezvous_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /ws/ {
        limit_req zone=ws_rate burst=40 nodelay;
        limit_conn conn_limit 25;

        proxy_pass http://rendezvous_backend/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600;
    }

    location / {
        limit_req zone=api_rate burst=20 nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://rendezvous_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
